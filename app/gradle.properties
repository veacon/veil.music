android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=36
# 开发机（Windows）构建：放开并行、加大堆、启用构建缓存，缩短编译时间。
# 盒子只用于 adb 安装，不参与构建，无需保留原来的低配参数。
# 机器：16 核 / 16GB 内存（清理后空闲约 8G）。已把 16 核全部放开使用。
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1536m -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# 16 核全占满：不再人为压低 worker 数。
org.gradle.workers.max=16
# Kotlin 编译守护进程单独给内存，避免大文件（熔岩/频谱）编译时频繁 GC 或回退进程内编译。
kotlin.daemon.jvmargs=-Xmx2g
kotlin.incremental=true
kotlin.code.style=official
