android.useAndroidX=true
# 依赖已全量 AndroidX，不需要 jetifier 重写 AAR 里的旧 support 引用（构建期少一遍全量改写）。
android.suppressUnsupportedCompileSdk=35
org.gradle.jvmargs=-Xmx3g
# 这台机器物理内存只有 16G，且常驻其它进程；并行 + 大堆会让 lint 分析期 JVM OOM 直接崩。
org.gradle.parallel=false
org.gradle.caching=true

# Kotlin 编译守护进程走本地 RMI，在受限网络/沙箱里会被 reset（日志里是
# "Error unmarshaling return header ... Connection reset"，然后回退到无守护进程编译）。
# 固定为 in-process 让构建结果稳定，代价是没办法复用热编译器。
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
